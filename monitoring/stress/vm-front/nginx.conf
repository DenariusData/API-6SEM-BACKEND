# Mesmo site do deploy/nginx-akavision.conf (papel "front"): build estático
# e /api/ para a VM do back (10.10.10.5:8000).
server {
    listen 80 default_server;
    server_name _;
    root /var/www/akavision;
    index index.html;
    client_max_body_size 12m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://10.10.10.5:8000;
        proxy_set_header Host 10.10.10.5:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 620s;
        proxy_send_timeout 620s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # stub_status para o monitoramento (só da rede interna)
    location = /nginx_status {
        stub_status;
        allow 10.10.10.0/24;
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
