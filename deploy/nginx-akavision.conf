# Site do AkaVision no nginx da VM. Instalado em
# /etc/nginx/sites-available/akavision (link em sites-enabled).
#
# Uma porta só (80) para o navegador:
#   /api/...  -> backend (gunicorn em 127.0.0.1:8000)
#   o resto   -> build do front em /var/www/akavision
# Front e API no mesmo endereço: sem CORS e sem expor a porta do backend.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/akavision;
    index index.html;

    # Upload de PDF: o backend aceita até 10 MB; folga para o resto do form.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A pergunta para a IA pode levar minutos na CPU (gunicorn: 620 s).
        proxy_read_timeout 620s;
        proxy_send_timeout 620s;
    }

    # Arquivos do build com hash no nome: cache longo no navegador.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rotas do Vue (history mode): qualquer caminho cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
