# Localmente os alertas ficam visíveis na tela do Alertmanager
# (http://localhost:9093) e no painel do Grafana. Para receber no Discord,
# Telegram ou e-mail, troque o receiver "painel" (exemplo comentado abaixo).

route:
  receiver: painel
  group_by: [alertname, severidade]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severidade="critico"]
      receiver: painel
      repeat_interval: 30m

receivers:
  - name: painel
  # Exemplo com Discord (Alertmanager >= 0.25):
  # - name: discord
  #   discord_configs:
  #     - webhook_url: https://discord.com/api/webhooks/<id>/<token>

# Se a API caiu, não adianta avisar também que ela está lenta.
inhibit_rules:
  - source_matchers: [alertname="ApiForaDoAr"]
    target_matchers: [componente="api"]
