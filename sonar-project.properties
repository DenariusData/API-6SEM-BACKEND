# SonarQube Cloud: histórico de resultados e cobertura dos testes
# unitários e de integração (job sonarqube do CI).
# A organização e a chave do projeto são as criadas ao importar o repositório
# no sonarcloud.io; se forem diferentes, ajuste aqui.
sonar.organization=denariusdata
sonar.projectKey=DenariusData_API-6SEM-BACKEND
sonar.projectName=API-6SEM-BACKEND

sonar.sources=api,core_api,credenciais
sonar.tests=tests
sonar.exclusions=**/migrations/**,**/management/commands/**
# Scripts e configuração de servidor (deploy/) não rodam nos testes: ficam
# fora da conta de cobertura, como as migrations e os comandos.
sonar.coverage.exclusions=deploy/**

# shell:S5332 (protocolo sem criptografia) no instalar-vm.sh: as chamadas
# http são entre as VMs (back -> IA, endereço do site), dentro da rede
# interna, com o firewall de cada VM aceitando só o IP de quem precisa dela.
# HTTPS entre VMs fica para quando houver certificado interno.
sonar.issue.ignore.multicriteria=http_entre_vms
sonar.issue.ignore.multicriteria.http_entre_vms.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.http_entre_vms.resourceKey=deploy/instalar-vm.sh

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml
