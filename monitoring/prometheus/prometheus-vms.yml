# Prometheus da VM de MONITORAMENTO (akavision-monitor, 10.10.10.8) olhando as
# outras três VMs da Rede NAT akavision-net. É a versão "VM" do
# prometheus.yml local (que olha a própria máquina por host.docker.internal).
#
# Em cada VM monitorada roda um node-exporter (:9100) e o ufw libera essa
# porta SÓ para 10.10.10.8. O rótulo "vm" é o que as regras de
# alertas-vms.yml usam para dar limites diferentes a cada máquina.
#
#   VM        IP           o que é coletado
#   back      10.10.10.5   node-exporter, /metrics do Django, 2 postgres-exporter
#   front     10.10.10.6   node-exporter, nginx (stub_status via exporter)
#   ia        10.10.10.7   node-exporter (o Ollama não tem /metrics: sonda)
#   monitor   10.10.10.8   node-exporter, Prometheus, Alertmanager, Grafana

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    ambiente: vm

rule_files:
  - alertas.yml
  - alertas-vms.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

scrape_configs:
  # Recursos de cada máquina: CPU, memória, disco, OOM, pressão de memória.
  - job_name: node
    static_configs:
      - targets: ["10.10.10.5:9100"]
        labels: {vm: back}
      - targets: ["10.10.10.6:9100"]
        labels: {vm: front}
      - targets: ["10.10.10.7:9100"]
        labels: {vm: ia}
      - targets: ["localhost:9100"]
        labels: {vm: monitor}

  - job_name: django
    metrics_path: /metrics
    static_configs:
      - targets: ["10.10.10.5:8000"]
        labels: {servico: backend, vm: back}

  - job_name: postgres
    static_configs:
      - targets: ["10.10.10.5:9187"]
        labels: {banco: rag, vm: back}
      - targets: ["10.10.10.5:9188"]
        labels: {banco: credenciais, vm: back}

  - job_name: nginx
    static_configs:
      - targets: ["10.10.10.6:9113"]
        labels: {vm: front}

  - job_name: monitoramento
    static_configs:
      - targets: ["localhost:9090"]
        labels: {vm: monitor, servico: prometheus}
      - targets: ["localhost:9093"]
        labels: {vm: monitor, servico: alertmanager}
      - targets: ["localhost:3000"]
        labels: {vm: monitor, servico: grafana}

  # "Está no ar?" visto de fora, como o usuário veria.
  - job_name: sondas
    metrics_path: /probe
    params:
      module: [http_no_ar]
    static_configs:
      - targets: ["http://10.10.10.6/"]
        labels: {alvo: frontend, vm: front}
      - targets: ["http://10.10.10.5:8000/api/auth/me/"]
        labels: {alvo: api, vm: back}
      - targets: ["http://10.10.10.7:11434/"]
        labels: {alvo: ollama, vm: ia}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9115
